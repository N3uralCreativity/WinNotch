name: Publish Plugin SDK

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Package version to publish, for example 0.5.3
        required: true
        type: string
  release:
    types:
      - published

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve package version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.package_version }}"
          } else {
            $version = "${{ github.event.release.tag_name }}".TrimStart('v', 'V')
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Package version could not be determined."
          }

          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore package project
        run: dotnet restore src/WinNotch.PluginSdk/WinNotch.PluginSdk.csproj -p:Configuration=Release -p:RuntimeIdentifier=win-x64

      - name: Pack WinNotch Plugin SDK
        run: dotnet pack src/WinNotch.PluginSdk/WinNotch.PluginSdk.csproj -c Release -p:RuntimeIdentifier=win-x64 -p:PackageVersion=${{ env.PACKAGE_VERSION }} -o artifacts/packages --no-restore

      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinNotch.PluginSdk-${{ env.PACKAGE_VERSION }}
          path: artifacts/packages/*.nupkg
